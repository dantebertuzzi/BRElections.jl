name: Scheduled checks
on:
  schedule:
    # Toda segunda-feira às 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Roda a suíte com BRElections_TEST_NETWORK=true: confere, via HEAD
  # requests, se as URLs de todos os datasets (available_datasets()) ainda
  # existem no CDN do TSE para os anos testados. Se o TSE mudar o nome de um
  # diretório/prefixo, remover um dataset ou reestruturar o CDN, este job
  # falha e o GitHub avisa por e-mail (comportamento padrão de scheduled
  # workflow que falha).
  tse-links:
    name: Links do TSE ainda existem?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      # O CDN do TSE (Akamai) bloqueia com HTTP 403 ou fica indisponível de
      # tempos em tempos, para o domínio inteiro. Isso não é link quebrado, e
      # falhar nesse caso só geraria e-mail de alarme falso toda segunda.
      # Sonda uma URL conhecida antes de gastar o runner: 200 ou 404 querem
      # dizer que o CDN está respondendo (e 404 é justamente o que este job
      # existe para pegar); qualquer outra coisa é indisponibilidade.
      - name: Sonda o CDN do TSE
        id: probe
        run: |
          url="https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_vagas/consulta_vagas_2022.zip"
          code=$(curl -sS -o /dev/null -w "%{http_code}" -I --max-time 60 --retry 2 "$url" || echo "000")
          echo "HEAD $url -> $code"
          echo "status=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ] || [ "$code" = "404" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CDN do TSE indisponível::HEAD retornou $code — checagem de links pulada (indisponibilidade do TSE, não link quebrado)."
            {
              echo "## CDN do TSE indisponível"
              echo
              echo "\`HEAD $url\` retornou **HTTP $code**."
              echo
              echo "A checagem de links foi pulada: isso indica bloqueio ou indisponibilidade"
              echo "do lado do TSE, não link quebrado no pacote."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # O CDN do TSE ocasionalmente dá timeout de conexão a partir dos
      # runners do GitHub (ruído de rede, não link quebrado de verdade) —
      # tenta de novo algumas vezes antes de considerar falha real.
      - name: Roda a suíte com BRElections_TEST_NETWORK=true (com retry)
        if: steps.probe.outputs.up == 'true'
        env:
          BRElections_TEST_NETWORK: "true"
        run: |
          for attempt in 1 2 3; do
            julia --project -e 'using Pkg; Pkg.test()' && exit 0
            echo "Tentativa $attempt falhou; aguardando antes de tentar de novo…"
            sleep 30
          done
          exit 1

  # Atualiza as dependências (CSV.jl, DataFrames.jl, StringEncodings.jl,
  # ZipFile.jl, Scratch.jl, ...) para as versões mais recentes permitidas
  # pelo [compat] e roda a suíte offline contra elas. Pega quebras de API
  # em pacotes de terceiros antes que cheguem a um usuário final (o
  # CompatHelper só abre PR sugerindo o bump; este job garante que os
  # testes de fato passam com a versão nova antes de aceitar o bump).
  latest-deps:
    name: Testes com dependências mais recentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Atualiza dependências para as versões mais recentes compatíveis
        run: julia --project -e 'using Pkg; Pkg.update()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
